name: Refresh site

# A free static copy of the dashboard (docs/DEPLOY.md, "A free static copy"): about every three
# hours the pipeline runs against Base mainnet on a GitHub runner, the database is kept in the
# Actions cache between runs, and the static build is uploaded to Cloudflare Pages. It needs the
# repository secrets DEPTHWATCH_RPC_URL, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; it runs
# only on its schedule and by hand, never for a pull request, so no fork sees them.

on:
  schedule:
    # Every hour at minute 23 (UTC), a check: the job "due" lets a scheduled run refresh only when
    # the last refresh is old enough. GitHub starts scheduled runs late, or not at all, when it is
    # busy: from 1 to 12 November 2026 the earlier schedule, every third hour, ran 36 times, at a
    # median gap of 7.3 hours and at most 13.1. Asking every hour, a skipped run costs an hour,
    # not three.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  # To list the saved databases when a restore finds none (Stop if a saved database was lost).
  actions: read

jobs:
  # Whether this run refreshes. A run by hand always does. A scheduled run does when the last
  # refresh that published started at least 150 minutes ago, and no other refresh is running or
  # waiting: with checks on time, one refresh every three hours, the 30 minutes short of three
  # absorbing a late start. If GitHub's API cannot say, or this job fails, the run refreshes: a
  # refresh too many beats none.
  due:
    name: due
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # It only reads this workflow's runs and their jobs.
    permissions:
      actions: read
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      # The runner's own Node, no checkout and no install. It reads this workflow's runs on main,
      # newest first, and the jobs of each (a check that was not due has its refresh skipped). A
      # refresh counts once its publish step succeeded, even if a later step failed (a refused
      # trade switch fails the run after publishing), and while it runs or waits to run once its
      # run's check has finished. A refresh that failed before publishing does not count, so the
      # next hourly check tries again. All requests share one deadline of 3 minutes, inside the
      # job's 5. The token reaches the script through its environment only.
      - name: Check the last refresh
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node -e '
            const fs = require("node:fs")
            const MIN_MINUTES = 150
            const PUBLISH = "Publish to Cloudflare Pages"
            const deadline = AbortSignal.timeout(180000)
            const answer = (due, line) => {
              console.log(line)
              fs.appendFileSync(process.env.GITHUB_OUTPUT, "due=" + due + "\n")
            }
            const get = async (path) => {
              const url = process.env.GITHUB_API_URL + "/repos/" + process.env.GITHUB_REPOSITORY + "/actions" + path
              const response = await fetch(url, {
                headers: {
                  accept: "application/vnd.github+json",
                  authorization: "Bearer " + process.env.GITHUB_TOKEN,
                  "x-github-api-version": "2022-11-28",
                },
                signal: deadline,
              })
              if (!response.ok) throw new Error(path + " answered HTTP " + response.status)
              return response.json()
            }
            const published = (job) =>
              Array.isArray(job.steps) && job.steps.some((step) => step.name === PUBLISH && step.conclusion === "success")
            const check = async () => {
              if (process.env.GITHUB_EVENT_NAME !== "schedule") {
                answer(true, "A run by hand always refreshes.")
                return
              }
              const listed = await get("/workflows/refresh-site.yml/runs?branch=main&per_page=20")
              const runs = listed?.workflow_runs
              if (!Array.isArray(runs)) throw new Error("the list of runs holds no workflow_runs")
              for (const run of runs) {
                const jobs = (await get("/runs/" + run.id + "/jobs"))?.jobs
                if (!Array.isArray(jobs)) throw new Error("run " + run.id + " lists no jobs")
                const refresh = jobs.find((job) => job.name === "refresh")
                if (refresh === undefined) continue
                if (refresh.status !== "completed") {
                  if (!jobs.some((job) => job.name === "due" && job.status === "completed")) continue
                  answer(false, "A refresh is running or waiting to run (" + run.html_url + "): not due.")
                  return
                }
                if (!published(refresh)) continue
                const started = Date.parse(refresh.started_at)
                if (Number.isNaN(started)) throw new Error("run " + run.id + " has no start time")
                const minutes = Math.floor((Date.now() - started) / 60000)
                const due = minutes >= MIN_MINUTES
                answer(due, "The last refresh that published started " + minutes + " minutes ago (" + run.html_url + "): " +
                  (due ? "due." : "not due before " + MIN_MINUTES + " minutes; the next hourly check asks again."))
                return
              }
              answer(true, "None of the last " + runs.length + " runs on main has a refresh that published: due.")
            }
            check().catch((error) => {
              console.log("::warning::Could not read the last refresh (" + error.message + "); refreshing anyway.")
              fs.appendFileSync(process.env.GITHUB_OUTPUT, "due=true\n")
            })
          '

  refresh:
    name: refresh
    needs: due
    # Only the default branch publishes and keeps the database: a run by hand from another branch
    # would deploy that branch's build and save its database in that branch's cache. Then only a
    # due run, or one whose check failed (no answer is "false"); a cancelled run stops here.
    if: github.ref == 'refs/heads/main' && !cancelled() && needs.due.outputs.due != 'false'
    # The group Trade switch shares (trade-switch.yml): the two never publish at once. It is on this
    # job, not on the whole run, so a check that is not due never joins it. GitHub keeps one run
    # waiting per group and cancels the one already waiting when another joins; only a refresh,
    # which publishes the same switch, or a newer Trade switch can replace a waiting one.
    concurrency:
      group: refresh-site
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # A first run seeds the pools of the reference tokens (and, since the stocks change, of the
    # ten tokenized stocks with them: 6,200 more factory calls). On 29 October 2026 the seed took 24
    # minutes on Alchemy's free tier (about 14,600 creation-block search requests) and the whole run
    # about 28. Later runs are expected to take a few minutes.
    timeout-minutes: 45
    env:
      DEPTHWATCH_DB: ${{ github.workspace }}/.depthwatch/depthwatch.db
      # Seven days of history is what the site shows; snapshots are kept at least 8 days.
      DEPTHWATCH_KEEP_DAYS: "8"
      # The Cloudflare Pages project, and so the site's address: https://depthwatch.pages.dev.
      PAGES_PROJECT: depthwatch
    steps:
      # Secrets are given only to the steps that use them: the RPC endpoints to the three steps
      # that read the chain, the Cloudflare token to the publish step.
      - name: Check settings
        env:
          DEPTHWATCH_RPC_URL: ${{ secrets.DEPTHWATCH_RPC_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$DEPTHWATCH_RPC_URL" ] || missing="$missing DEPTHWATCH_RPC_URL"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (docs/DEPLOY.md, A free static copy)"
            exit 1
          fi
      # Actions are pinned to commit SHAs; the comment names the release each SHA is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install pnpm
        run: npm install --global pnpm@10.28.0
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # The newest saved database. The key never matches exactly (run and attempt are new), so the
      # newest entry by prefix is restored, and every attempt can save its own.
      - name: Restore the database
        id: restore-db
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .depthwatch
          key: depthwatch-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: depthwatch-db-
      # A failed restore is reported like a miss. Only a repository with no saved database (the
      # first run, or every entry evicted) may start from an empty one; otherwise the run stops,
      # the published copy stays as it was, and an empty history is never saved over the old one.
      - name: Stop if a saved database was lost
        if: steps.restore-db.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          saved=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key depthwatch-db- --limit 1 --json key --jq length)
          if [ "$saved" != "0" ]; then
            echo "::error::A saved database exists but was not restored; nothing was changed. The next run tries again."
            exit 1
          fi
      - name: Discover (seed)
        # A DEX whose factory reads fail is reported and seeded again next run; the others go on.
        continue-on-error: true
        env:
          DEPTHWATCH_RPC_URL: ${{ secrets.DEPTHWATCH_RPC_URL }}
        run: |
          mkdir -p .depthwatch
          pnpm depthwatch discover --seed
      - name: Snapshot
        env:
          DEPTHWATCH_RPC_URL: ${{ secrets.DEPTHWATCH_RPC_URL }}
        run: pnpm depthwatch snapshot
      - name: Volume
        # If every logs endpoint fails, the site is still published, and the score keeps the last
        # complete 24 h window (null once it is older than a day).
        continue-on-error: true
        # A throttled endpoint must not use up the job's time: past this the step fails alone. The
        # tries below take at most 300 + 420 s.
        timeout-minutes: 15
        # eth_getLogs endpoints, in order, until one pass succeeds:
        # 1. the optional secret DEPTHWATCH_LOGS_RPC_URL, at the default 2,000-block chunk;
        # 2. Tenderly's public gateway, no key. Measured on 29 October 2026, it serves at most
        #    1,001 blocks and 20,000 results per eth_getLogs (its docs say 3,000 results). Its docs
        #    give 1 GB of answers a day per IP (https://docs.tenderly.co/node-rpc/overview.md,
        #    "Public endpoint limits") and call public endpoints rate-limited, production use
        #    taking a dedicated node (https://docs.tenderly.co/platform/supported-networks.md).
        #    Since Denim (2026-11-05 18:00 UTC) Base makes five blocks a second, so three hours are
        #    54,000 blocks: 1,000-block chunks, 200 s of chain each, hold fewer logs than the
        #    250-block chunks of 2 s blocks (500 s) that kept the densest window measured under
        #    both limits and under viem's 10 MiB answer limit, for a quarter of the requests.
        # Base's public RPC is not tried: it allows 5 eth_getLogs a second per IP, runners share
        # IPs, and on 29 October 2026 it refused the runner's first request (HTTP 429, -32011).
        # A try past its time gets SIGKILL, which timeout sends to its whole process group. With
        # SIGTERM, pnpm would exit at once and the CLI under it, which does not stop on the first
        # SIGTERM and honours any Retry-After, would keep running and could store its pass over a
        # later try's. A killed pass stores nothing: its only write is one final transaction. The
        # endpoint reaches the CLI through its environment, never its arguments.
        env:
          DEPTHWATCH_RPC_URL: ${{ secrets.DEPTHWATCH_RPC_URL }}
          SECRET_LOGS_RPC_URL: ${{ secrets.DEPTHWATCH_LOGS_RPC_URL }}
        run: |
          pass() { DEPTHWATCH_LOG_CHUNK="$2" timeout --signal=KILL "$1" pnpm depthwatch volume; }
          if [ -n "$SECRET_LOGS_RPC_URL" ]; then
            echo "Volume through the DEPTHWATCH_LOGS_RPC_URL secret"
            DEPTHWATCH_LOGS_RPC_URL="$SECRET_LOGS_RPC_URL" pass 300s 2000 && exit 0
            echo "::warning::Volume through DEPTHWATCH_LOGS_RPC_URL failed (exit $?);" \
              "trying Tenderly's public gateway."
          fi
          echo "Volume through Tenderly's public gateway"
          DEPTHWATCH_LOGS_RPC_URL=https://gateway.tenderly.co/public/base pass 420s 1000
      - name: Score
        run: pnpm depthwatch score
      - name: Prune
        run: pnpm depthwatch prune
      - name: Save the database
        if: always() && hashFiles('.depthwatch/depthwatch.db') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .depthwatch
          key: depthwatch-db-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Export the bundle
        id: export
        # The trade switch (docs/DEPLOY.md, "Trade switch"), written into the bundle's
        # features.trade and into data/flags.json next to it. Unset, empty or `off` means off; a
        # comma-separated list of trade venues turns those on. An unknown or held venue fails
        # closed: export writes the switch off and exits 3, this run publishes that, and the last
        # step fails the run. A repository variable, not a secret, and only this step sees it.
        env:
          DEPTHWATCH_TRADE: ${{ vars.DEPTHWATCH_TRADE }}
        run: |
          code=0
          pnpm depthwatch export --out apps/web/static-data/bundle.json \
            --note "Read from Base mainnet by the Depthwatch pipeline several times a day, through a free RPC plan. Each copy is a snapshot: it does not change until the next one replaces it." \
            --updates several-times-a-day \
            || code=$?
          if [ "$code" = 3 ]; then
            echo "trade_refused=true" >> "$GITHUB_OUTPUT"
            echo "::error::DEPTHWATCH_TRADE was refused (the line above says why): publishing with the trade switch off, then failing the run."
          elif [ "$code" != 0 ]; then
            exit "$code"
          fi
      # Nothing seeded or snapshotted (every DEX failed on a first run): keep the published copy.
      - name: Check the bundle
        run: |
          node -e 'const b = JSON.parse(require("node:fs").readFileSync("apps/web/static-data/bundle.json", "utf8")); if (b.pools.length === 0) { console.log("::error::The bundle holds no pools; the published copy is kept."); process.exit(1) }'
      # The build writes 404.html at the top of the output (apps/web/public/404.html): without one,
      # Pages answers every unknown path, /api/... included, with index.html and HTTP 200, and this
      # copy has no API.
      - name: Build the static site
        run: pnpm --filter @depthwatch/web build:static
      # No secret is in this step's environment and no install script runs: uploading a directory
      # of static files needs neither workerd nor esbuild.
      - name: Install wrangler
        run: npm install --global --ignore-scripts --no-audit wrangler@4.150.0
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The project is created on the first run; later runs report that it exists and go on.
          wrangler pages project create "$PAGES_PROJECT" --production-branch main \
            || echo "Pages project $PAGES_PROJECT exists or could not be created; deploying to it."
          wrangler pages deploy apps/web/dist-static \
            --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true
      # A refused DEPTHWATCH_TRADE was published as off above; the run still fails so it is seen.
      - name: Fail on a refused trade switch
        if: steps.export.outputs.trade_refused == 'true'
        run: |
          echo "::error::DEPTHWATCH_TRADE was refused, so the site now serves the trade switch off. Correct the variable (docs/DEPLOY.md, Trade switch)."
          exit 1
