name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 22.13 is the floor in package.json "engines" (node:sqlite without a flag); 24 is the
        # current LTS line.
        node: ["22.13", "24"]
    steps:
      # Actions are pinned to commit SHAs; the comment names the release each SHA is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install pnpm
        run: npm install --global pnpm@10.28.0
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:static
      # Advisories in production dependencies: a high or critical one fails the job; a moderate or
      # low one is listed and leaves a warning on the run. An audit service that does not answer
      # fails the job too; run it again.
      - name: Audit production dependencies
        run: |
          if ! pnpm audit --prod; then
            echo "::warning::pnpm audit lists advisories in production dependencies (above)."
          fi
          pnpm audit --prod --audit-level=high
